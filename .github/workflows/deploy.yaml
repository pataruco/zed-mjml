name: Deploy
run-name: ${{ github.actor }} is uploading mjml-lsp binaries for ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload binaries to, e.g. zed-mjml-v0.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is well formed and its release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^zed-mjml-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not look like zed-mjml-v<major>.<minor>.<patch>"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null; then
            echo "::error::No GitHub release exists for '$TAG'. Merge the release-please PR first."
            exit 1
          fi

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          targets: ${{ matrix.target }}

      - name: 🔨 Build mjml-lsp
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --manifest-path crates/mjml-lsp/Cargo.toml --target "$BUILD_TARGET"

      - name: 📦 Package binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cd "crates/mjml-lsp/target/${BUILD_TARGET}/release"
          gzip -c mjml-lsp > "mjml-lsp-${BUILD_TARGET}.gz"

      - name: 🚀 Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "crates/mjml-lsp/target/${BUILD_TARGET}/release/mjml-lsp-${BUILD_TARGET}.gz"
